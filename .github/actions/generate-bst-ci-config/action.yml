name: Generate local BuildStream CI config
description: Write a BuildStream configuration for local builds without remote CAS or execution.

runs:
  using: composite
  steps:
    - name: Generate local BuildStream CI config
      shell: bash
      run: |
        set -euo pipefail
        WORKSPACE_ROOT="${GITHUB_WORKSPACE:-$PWD}"
        mkdir -p "$WORKSPACE_ROOT/logs"
        cat > "$WORKSPACE_ROOT/buildstream-ci.conf" <<'BSTCONF'
        scheduler:
          on-error: continue
          fetchers: 16
          builders: 2
          network-retries: 3

        logging:
          message-format: '[%{wallclock}][%{elapsed}][%{key}][%{element}] %{action} %{message}'
          error-lines: 80

        cachedir: /root/.cache/buildstream
        logdir: /src/logs

        build:
          retry-failed: True
          max-jobs: 2

        cache:
          cache-buildtrees: never
        BSTCONF
        cp "$WORKSPACE_ROOT/buildstream-ci.conf" "$WORKSPACE_ROOT/logs/buildstream-ci.conf"
        echo "=== Local BuildStream CI config ==="
        cat "$WORKSPACE_ROOT/buildstream-ci.conf"
