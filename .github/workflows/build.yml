name: Build Bluefin dakota

on:
  push:
    # The next stream is paused until the next GNOME beta; add next back here
    # (and to pull_request below) when it returns. queue: max keeps every
    # queued run (FIFO) instead of superseding — the stale-check job below
    # collapses burst days to one build of the newest state.
    branches: [satanic-branding]
    paths:
      - "elements/**"
      - "plugins/**"
      - "patches/**"
      - "Justfile"
      - "project.conf"
      - "include/**"
  # Fires daily at 13:00 UTC — 5 hours after the gnome-build-meta nightly
  # (~08:00 UTC) to absorb nightly deltas before building.
  # NOTE: schedule triggers run on the default branch; set satanic-branding as the
  # default branch in repo settings for this to target satanic-branding.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
  # Label a same-repo PR `build` to build it; adding the label starts a run.
  pull_request:
    branches: [satanic-branding]
    types: [opened, synchronize, reopened, labeled]

permissions: read-all

env:
  IMAGE_NAME: dakota
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

# queue: max holds up to 100 pending runs FIFO. The default (queue: single)
# keeps only ONE pending run per group and cancels the previous pending run
# whenever a new one arrives — so a satanic-branding push followed ~40s later by the
# sync-next push to next silently discarded the satanic-branding build (2026-08-22).
concurrency:
  group: dakota-bst-build-global
  cancel-in-progress: false
  queue: max

jobs:
  verify-default-branch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Verify repository default branch is "satanic-branding"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          db=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          if [ "$db" != "satanic-branding" ]; then
            echo "::error::default branch is '$db', expected 'satanic-branding'. Daily schedule will silently target wrong branch. Fix repo settings."
            exit 1
          fi

  # With queue: max every push queues its own run instead of superseding the
  # previous pending one. A run that waited in the queue may be stale by the
  # time it starts: a newer push run for the same branch is already queued
  # and will build a superset of this state. Skip the expensive build then.
  stale-check:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Check for newer queued run on this branch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          newer=0
          # Concurrency-held runs surface as "queued" or "pending" depending
          # on where they wait; count both.
          for status in queued pending; do
            n=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow build.yml \
              --branch "$BRANCH" \
              --event "${{ github.event_name }}" \
              --status "$status" \
              --json databaseId \
              --jq "[.[] | select(.databaseId > ${{ github.run_id }})] | length")
            newer=$((newer + n))
          done
          if [ "$newer" -gt 0 ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "${newer} newer queued run(s) for ${BRANCH} — skipping stale build"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [verify-default-branch, stale-check]
    if: (!cancelled()) && needs.stale-check.outputs.stale != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build') && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    # Build and export the NVIDIA gaming image locally, then hand it to
    # publish.yml through a temporary GHCR tag instead of a shared CAS.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - variant: nvidia-gaming
            element: oci/bluefin-nvidia.bst
            image_suffix: "-nvidia-gaming"
            publish: true
            continue: false
            gaming: "true"
    continue-on-error: ${{ matrix.continue }}
    env:
      BUILD_GAMING: ${{ matrix.gaming || 'false' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Capture build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          native-overlay: true
          install-tools: '["just"]'

      - name: Generate local BuildStream CI config
        uses: ./.github/actions/generate-bst-ci-config

      - name: Build OCI image with BuildStream
        env:
          BST_FLAGS: >-
            --builders 1
            --max-jobs 2
            -o x86_64_v3 false
            --no-interactive
            --config /src/buildstream-ci.conf
        run: |
          set -o pipefail
          CONSOLE_LOG="logs/bst-console-${{ matrix.variant }}.log"
          just bst build --deps none ${{ matrix.element }} 2>&1 \
            | tee "$CONSOLE_LOG" \
            | python3 files/scripts/bst-progress.py

        timeout-minutes: 330

      - name: Export OCI image from local BuildStream artifacts
        env:
          BST_FLAGS: -o x86_64_v3 false --no-interactive --config /src/buildstream-ci.conf
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BUILD_GAMING: ${{ matrix.gaming || 'false' }}
          OCI_IMAGE_CREATED: ${{ steps.timestamp.outputs.created }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_VERSION: ${{ github.sha }}
        run: just export nvidia

      - name: Chunkify and validate image
        env:
          BUILD_IMAGE_NAME: ${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
        run: |
          just chunkify "localhost/${BUILD_IMAGE_NAME}:latest"
          just lint
          just swap-audit
          just avatar-audit

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Push staging image for publish workflow
        if: github.event_name != 'pull_request'
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOCAL_IMAGE="${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}"
          IMAGE="${{ env.IMAGE_REGISTRY }}/${LOCAL_IMAGE}"
          sudo podman tag "localhost/${LOCAL_IMAGE}:latest" "${IMAGE}:build-${BUILD_SHA}"
          sudo podman push --compression-format=zstd "${IMAGE}:build-${BUILD_SHA}"

      - name: Push PR image
        if: github.event_name == 'pull_request'
        env:
          PR_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LOCAL_IMAGE="${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}"
          IMAGE="${{ env.IMAGE_REGISTRY }}/${LOCAL_IMAGE}"
          sudo podman tag "localhost/${LOCAL_IMAGE}:latest" "${IMAGE}:${PR_TAG}"
          sudo podman push --compression-format=zstd "${IMAGE}:${PR_TAG}"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buildstream-logs-x86_64-${{ matrix.variant }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  # Required check: pending until a `build`-labeled PR has built.
  build-gate:
    needs: [stale-check, build]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a green build when the PR is labeled build
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'build') }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          STALE: ${{ needs.stale-check.outputs.stale }}
          BUILD: ${{ needs.build.result }}
        run: |
          [ "$LABELED" = "true" ] || exit 0
          [ "$SAME_REPO" = "true" ] || { echo "::error::build label needs a same-repo branch"; exit 1; }
          [ "$STALE" != "true" ] || exit 0
          [ "$BUILD" = "success" ] || { echo "::error::build result: $BUILD"; exit 1; }
