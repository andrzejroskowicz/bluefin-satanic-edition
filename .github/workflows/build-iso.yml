name: Build Satanic Edition ISO

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Full GHCR ref of the published nvidia-gaming image, including its tag
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: satanic-edition-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build bootable ISO
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - name: Checkout Dakota ISO builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: projectbluefin/dakota-iso
          ref: d23d0e862cef766326a639caedbe569a33c71943
          path: dakota-iso

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: btrfs
          update-podman: true
          native-overlay: true
          install-tools: '["just"]'

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | podman login ghcr.io --username "$GH_ACTOR" --password-stdin

      - name: Set ISO payload image
        working-directory: dakota-iso
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_REF" =~ ^ghcr\.io/andrzejroskowicz/dakota-nvidia-gaming:[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::image_ref must be a tagged ghcr.io/andrzejroskowicz/dakota-nvidia-gaming image"
            exit 1
          fi
          printf '%s\n' "$IMAGE_REF" > dakota/payload_ref
          echo "ISO payload: $IMAGE_REF"

      - name: Build ISO
        working-directory: dakota-iso
        run: just iso-sd-boot dakota

      - name: Upload ISO artifact
        uses: actions/upload-artifact@cf430e030bbd5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satanic-edition-live-iso-${{ github.run_number }}
          path: dakota-iso/output/dakota-live.iso
          if-no-files-found: error
          retention-days: 14
